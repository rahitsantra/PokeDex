<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">PokéDex</div>
    <p class="subtitle">Search · Browse · Discover</p>
  </header>

  <div class="controls">
    <div class="input-wrapper">
      <span class="input-icon">⚡</span>
      <input type="text" id="search" placeholder="Search by name or number..." autocomplete="off" spellcheck="false">
    </div>
    <button id="searchBtn" onclick="searchPokemon()">Search</button>
    <button id="resetBtn" onclick="resetSearch()" class="reset-btn hidden">✕ Reset</button>
  </div>

  <div id="errorBanner" class="error-banner hidden"></div>

  <div id="pokemonList" class="grid"></div>

  <div class="pagination" id="pagination">
    <button onclick="prevPage()" id="prevBtn">← Prev</button>
    <span id="pageInfo" class="page-info"></span>
    <button onclick="nextPage()" id="nextBtn">Next →</button>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" onclick="closeModal()"></div>
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <div id="details"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
